[project]
name = "matchverse"
version = "0.1.0"
description = "End-to-end matchmaking recommender: trains an XGBoost compatibility model on user interactions and serves personalized profile suggestions via Streamlit."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "implicit>=0.7.2",
    "scikit-learn>=1.7.2",
    "streamlit>=1.50.0",
    "tqdm>=4.67.1",
    "xgboost>=3.1.1",
]
